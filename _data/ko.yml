publications:
  title: 주요 논문
  papers:
    - title: "ArchCode: Incorporating Software Requirements in Code Generation with Large Language Models"
      link: https://aclanthology.org/2024.acl-long.730/
      code: https://github.com/ldilab/ArchCode
      authors: Hojae Han, Jaejin Kim, Jaeseok Yoo, Youngwon Lee, Seung-won Hwang (2저자)
      conference: ACL 2024 · 37회 인용 · 요구사항을 코드 생성·검증에 반영해 코드 생성 정확도 SOTA 달성, 생성 코드의 비기능 요구사항(실행 시간·견고성·유지보수성·신뢰성)을 평가하는 첫 벤치마크 HumanEval-NFR 제안
    - title: "DuET: Dual Execution for Test Output Prediction with Generated Code and Pseudocode"
      link: https://aclanthology.org/2026.findings-acl.2144/
      code: https://github.com/ldilab/DuET
      authors: Hojae Han, Jaejin Kim, Seung-won Hwang, Yu Jin Kim, Moontae Lee (2저자)
      conference: Findings of ACL 2026 · LLM이 의사코드의 실행을 추론하게 하고 실제 코드 실행 결과와 다수결로 결합해 테스트 출력 예측에서 SOTA 달성
    - title: "PERC: Plan-As-Query Example Retrieval for Underrepresented Code Generation"
      link: https://aclanthology.org/2025.coling-main.534/
      code: https://github.com/medduk9871/perc
      authors: Jaeseok Yoo, Hojae Han, Youngwon Lee, Jaejin Kim, Seung-won Hwang (4저자)
      conference: COLING 2025 (short) · 학습 데이터가 적은 프로그래밍 언어의 few-shot 코드 생성에서 예시를 의사코드 계획으로 검색해 기존 RAG 방법을 앞섬

