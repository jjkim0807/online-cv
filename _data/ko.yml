career-profile:
  title: 요약
  summary: |
    서울대학교 인공지능전공 석사로 LLM 기반 코드 생성·평가를 연구했고, ACL·COLING에 논문 3편(ArchCode·DuET 2저자, PERC 4저자 · ArchCode 37회 인용)을 냈습니다.

    그중 두 편의 실험 프레임워크를 단독으로 구현하며, 생성된 코드를 Docker로 격리된 동일 환경에서 실행해 정답 여부뿐 아니라 실행 시간·메모리까지 공정하게 재는 평가 하네스를 만들어 왔습니다.

    그 위에서 vLLM·Ollama·LiteLLM 모델 서빙과 LangChain·LangGraph 에이전트 구성까지 직접 다뤘습니다.

