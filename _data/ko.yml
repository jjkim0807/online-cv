projects:
  title: 주요 프로젝트
  intro: 단독 개발 · 레포 비공개(요청 시 데모).
  assignments:
    - title: "MaestroACP — 자율 멀티에이전트 오케스트레이션 시스템"
      tagline: "Python, SQLite, LLM API. 메시지 기반 플래너/오케스트레이터/러너가 여러 호스트의 LLM 에이전트에 코딩 태스크를 분배하며, 태스크 원장·메모리 저장소·백그라운드 데몬을 갖춤."
    - title: "youtube-search-mcp — LLM 도구 서버"
      tagline: "Python, MCP, YouTube Data API v3. 검색·영상 검증을 LLM 에이전트용 도구로 노출하는 Model Context Protocol 서버."
    - title: "Pebble — 온디바이스 바둑 AI 앱"
      tagline: "Dart/Flutter, KataGo. KataGo 추론을 완전히 온디바이스(서버 없이)로 구동하는 모바일 바둑 앱, Lichess 스타일 UX."
    - title: "WorldGraph — LLM 기반 지식그래프"
      tagline: "Python, Neo4j. LLM 관계 추론으로 문서에서 타입드 엔티티 그래프를 구축."
    - title: "DanceMirror — 출시 안드로이드 앱"
      tagline: "Kotlin, CI/CD. 자동 릴리즈 파이프라인(main 푸시마다 릴리즈 APK 자동 배포)을 갖춘 춤 연습 앱."

