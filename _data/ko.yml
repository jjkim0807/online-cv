career-profile:
  title: 요약
  summary: |
    서울대학교 인공지능 석사로 **LLM 기반 코드 생성·평가**를 전공했으며, ACL·COLING에 논문 3편(ArchCode 인용 37회)을 발표했습니다. NLP 연구와 **엔드투엔드 엔지니어링**을 겸비 — 멀티에이전트 LLM 시스템, MCP 도구 서버, 온디바이스 ML 앱, 지식그래프 파이프라인을 단독으로 설계·배포했습니다. 연구 프로토타이핑부터 프로덕션 배포까지 두루 경험(Python, PyTorch, LLM 툴링, Android).

