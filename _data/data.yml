projects:
  title: Selected Projects
  intro: Solo developer; repos private (demo on request).
  assignments:
    - title: "MaestroACP — autonomous multi-agent orchestration system"
      tagline: "Python, SQLite, LLM APIs. Message-based planner/orchestrator/runner dispatching coding tasks to LLM agents across hosts, with task ledger, memory store, and background daemons."
    - title: "youtube-search-mcp — LLM tool-use server"
      tagline: "Python, MCP, YouTube Data API v3. Model Context Protocol server exposing search + video verification as callable tools for LLM agents."
    - title: "Pebble — on-device Go (Baduk) AI app"
      tagline: "Dart/Flutter, KataGo. Mobile Go app running KataGo inference fully on-device (no server), with a Lichess-style UX."
    - title: "WorldGraph — LLM-powered knowledge graph"
      tagline: "Python, Neo4j. Builds a typed entity graph from documents via LLM-based relation inference."
    - title: "DanceMirror — shipped Android app"
      tagline: "Kotlin, CI/CD. Dance-practice app with an automated release pipeline (each main push auto-publishes a release APK)."

