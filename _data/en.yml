career-profile:
  title: Summary
  summary: |
    M.S. in Artificial Intelligence (SNU) specializing in LLM-based code generation and evaluation; 3 papers at ACL / COLING (second author on ArchCode and DuET, fourth author on PERC; ArchCode 37 citations).

    Sole implementer of the experimental frameworks behind two of them, including evaluation harnesses that run generated code in Docker-isolated, identical environments to measure not just correctness but execution time and memory fairly.

    Hands-on with LLM serving (vLLM, Ollama, LiteLLM) and agent pipelines (LangChain, LangGraph).

