{% assign skills = site.data[page.lang].skills %} {% if skills %}
<section class="skills-section section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-wrench fa-stack-1x fa-inverse"></i>
    </span>
    {{ skills.title }}
  </h2>

  <div class="skillset">
    {% for group in skills.groups %}
    <div class="item" style="margin-bottom: 0.5em;">
      <strong>{{ group.name }}:</strong> {{ group.items }}
    </div>
    <!--//item-->
    {% endfor %}
  </div>
</section>
<!--//skills-section-->
{% endif %}
